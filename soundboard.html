<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Simple Soundboard</title>
<style>
  :root{
    --bg:#0f1724;
    --card:#0b1220;
    --accent:#7c3aed;
    --muted:#94a3b8;
    --text:#e6eef8;
    --glass: rgba(255,255,255,0.03);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial;
    background:linear-gradient(180deg,#071023 0%, #071228 60%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .app {
    width:100%;
    max-width:880px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:14px;
    padding:20px;
    box-shadow: 0 8px 30px rgba(2,6,23,0.6);
    border:1px solid rgba(255,255,255,0.03);
  }
  header{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:18px;
  }
  h1{font-size:20px;margin:0}
  p.lead{margin:0;color:var(--muted);font-size:13px}
  .controls{
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .control {
    background:var(--glass);
    padding:10px 12px;
    border-radius:10px;
    display:flex;
    gap:8px;
    align-items:center;
    border:1px solid rgba(255,255,255,0.02);
  }
  .control label{font-size:13px;color:var(--muted)}
  input[type="range"]{width:180px}
  .btn-mute{
    background:transparent;
    border:1px solid rgba(255,255,255,0.04);
    padding:8px 10px;
    border-radius:8px;
    color:var(--text);
    cursor:pointer;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .btn-mute.muted{
    background:linear-gradient(90deg, rgba(124,58,237,0.16), rgba(99,102,241,0.06));
    border-color: rgba(124,58,237,0.28);
  }
  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:12px;
  }
  .sound-btn {
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    padding:18px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.03);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:center;
    justify-content:center;
    min-height:96px;
    transition: transform .12s ease, box-shadow .12s ease;
    outline: none;
  }
  .sound-btn:active { transform: translateY(2px) scale(.996) }
  .sound-btn:focus { box-shadow: 0 8px 30px rgba(124,58,237,0.12); border-color: rgba(124,58,237,0.3) }
  .sound-icon{
    width:42px;height:42px;border-radius:10px;
    display:grid;place-items:center;
    background: linear-gradient(90deg, rgba(124,58,237,0.18), rgba(99,102,241,0.06));
    font-weight:700;color:#fff;font-size:16px;
  }
  .sound-name{font-weight:600}
  .hint{margin-top:12px;color:var(--muted);font-size:13px}
  footer{margin-top:14px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .small {font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Simple Soundboard</h1>
        <p class="lead">Click a button to play a sound.</p>
      </div>
    </header>

    <div class="controls">
      <div class="control">
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.9">
      </div>

      <div class="control">
        <button id="mute" class="btn-mute">🔈 <span id="muteLabel">Mute</span></button>
      </div>

      <div class="control" style="margin-left:auto">
        <label class="small">Status:</label>
        <div id="status" class="small" style="margin-left:8px">Ready</div>
      </div>
    </div>

    <main>
      <section class="grid" id="buttons"></section>
      
    </main>

    <footer>
      
      <div class="small">Keyboard friendly</div>
    </footer>
  </div>

<script>
const sounds = [
  { id: 'dog', name: 'Dog', file: 'sounds/dog.mp3' },
  { id: 'clap', name: 'Clap', file: 'sounds/clap.mp3' },
  { id: 'pop', name: 'Pop', file: 'sounds/pop.mp3' },
  { id: 'laugh', name: 'Laugh', file: 'sounds/laugh.mp3' },
  { id: 'ding', name: 'Ding', file: 'sounds/ding.mp3' }
];

const container = document.getElementById('buttons');
const statusEl = document.getElementById('status');
const volumeSlider = document.getElementById('volume');
const muteBtn = document.getElementById('mute');
const muteLabel = document.getElementById('muteLabel');

let muted = false;
let lastVolume = volumeSlider.value;

const player = new Audio();

sounds.forEach(s => {
  const btn = document.createElement('button');
  btn.className = "sound-btn";
  btn.innerHTML = `
    <div class="sound-icon">${s.name[0]}</div>
    <div class="sound-name">${s.name}</div>
  `;
  btn.onclick = () => playSound(s.file, s.id);
  container.appendChild(btn);
});

function playSound(file, id) {
  player.pause();
  player.currentTime = 0;
  player.src = file;
  player.volume = muted ? 0 : lastVolume;
  player.play();
  statusEl.textContent = "Played: " + id;
  setTimeout(() => statusEl.textContent = "Ready", 500);
}

volumeSlider.oninput = () => {
  lastVolume = volumeSlider.value;
  player.volume = muted ? 0 : lastVolume;
};

muteBtn.onclick = () => {
  muted = !muted;
  muteBtn.classList.toggle("muted", muted);
  muteLabel.textContent = muted ? "Muted" : "Mute";
  player.volume = muted ? 0 : lastVolume;
};
</script>


</body>
</html>
